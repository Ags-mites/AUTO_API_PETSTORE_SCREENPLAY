serenity {
  project.name = "Petstore API Tests (Screenplay)"
  test.root = "com.restapi"
  logging = VERBOSE
  take.screenshots = FOR_FAILURES
  browser.dispose.timeout = 1
}

webdriver {
    driver = null
}

restapi {
    base.url = "https://petstore.swagger.io/v2"
    timeout = 30000
}

environments {
  default {
    restapi.base.url = "https://petstore.swagger.io/v2"
  }
  qa {
    restapi.base.url = "https://petstore.swagger.io/v2"
  }
  staging {
    restapi.base.url = "https://petstore.swagger.io/v2"
  }
}
